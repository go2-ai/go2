---
openapi: 3.0.1
info:
  title: Reporting API
  version: v1
  description: |
    Report catalog, per-report access, running and drilling reports, statement
    layouts and mapping, and the AI mapping assistant. Hand-written (not
    generated by rswag); request specs in spec/requests/reporting and
    spec/requests/accounting/statement_* cover the behavior.

    Amounts are decimal strings on each line's normal side, rounded to the
    main currency's decimals. Errors are `{ "errors": ["..."] }`.
servers:
- url: http://localhost:5000
tags:
- name: Reports
- name: Report access
- name: Statement layouts
- name: Mapping assistant
components:
  parameters:
    organization_id: { name: organization_id, in: path, required: true, schema: { type: integer } }
    id: { name: id, in: path, required: true, schema: { type: integer } }
    report_id: { name: report_id, in: path, required: true, schema: { type: integer } }
    statement_id: { name: statement_id, in: path, required: true, description: The statement report's id, schema: { type: integer } }
    date: { name: date, in: query, description: "Balance sheet: as of (YYYY-MM-DD)", schema: { type: string, format: date } }
    from: { name: from, in: query, schema: { type: string, format: date } }
    to: { name: to, in: query, schema: { type: string, format: date } }
    comparison: { name: comparison, in: query, description: "false leaves the previous-year column out", schema: { type: boolean } }
    approved_only: { name: approved_only, in: query, schema: { type: boolean } }
  schemas:
    Report:
      type: object
      properties:
        id: { type: integer }
        report_type: { type: string, enum: [ accounting.statement, accounting.trial_balance, accounting.ratios ] }
        key: { type: string, nullable: true, description: System reports only }
        category: { type: string, enum: [ financial_statements, general_ledger, analysis ] }
        standard: { type: string, nullable: true }
        statement_type: { type: string, nullable: true, enum: [ balance_sheet, income_statement, cash_flow ] }
        name: { type: string }
        names: { type: object, additionalProperties: { type: string } }
        primary: { type: boolean }
        system: { type: boolean }
        parent_report_id: { type: integer, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        permissions:
          type: object
          properties:
            can_view: { type: boolean }
            can_edit: { type: boolean }
            can_copy: { type: boolean }
            can_manage_access: { type: boolean }
            can_drill_to_entries: { type: boolean }
    Check:
      type: object
      properties:
        severity: { type: string, enum: [ error, warning, info ] }
        code: { type: string, example: unmapped }
        column: { type: string }
        details: { type: object }
    Grant:
      type: object
      properties:
        id: { type: integer }
        grantee_type: { type: string, enum: [ Member, Role, Group, Department ] }
        grantee_id: { type: integer }
        grantee_name: { type: string }
        access: { type: string, enum: [ view, edit ] }
paths:
  "/organizations/{organization_id}/reporting/reports":
    parameters: [ { $ref: "#/components/parameters/organization_id" } ]
    get:
      tags: [ Reports ]
      summary: Reports the member may see (system presets and the organization's own)
      parameters:
      - { name: archived, in: query, schema: { type: boolean } }
      - { name: report_type, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Report" } } } } }
  "/organizations/{organization_id}/reporting/reports/{id}":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/id" } ]
    get: { tags: [ Reports ], summary: A report, responses: { "200": { description: OK }, "403": { description: No access } } }
    patch:
      tags: [ Reports ]
      summary: "Rename, describe or make primary (organization reports; edit access)"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: object, additionalProperties: { type: string } }
                description: { type: object, additionalProperties: { type: string } }
                primary: { type: boolean }
      responses: { "200": { description: OK }, "403": { description: Read-only or no access } }
    delete: { tags: [ Reports ], summary: Delete an organization report, responses: { "204": { description: Deleted } } }
  "/organizations/{organization_id}/reporting/reports/{id}/run":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/id" } ]
    get:
      tags: [ Reports ]
      summary: Run a report
      description: |
        Statements: `{ report, columns, lines, checks, currency }`. Trial balance:
        `{ from, to, level, rows, totals, checks, entries }` (params level, center_level,
        hide_zero). Ratios: `{ columns, sources, ratios }`. With `view=print` and `locale`,
        the data of the report's print template.
      parameters:
      - { $ref: "#/components/parameters/date" }
      - { $ref: "#/components/parameters/from" }
      - { $ref: "#/components/parameters/to" }
      - { $ref: "#/components/parameters/comparison" }
      - { $ref: "#/components/parameters/approved_only" }
      - { name: view, in: query, schema: { type: string, enum: [ print ] } }
      - { name: locale, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
        "403": { description: No access to this report }
        "422": { description: Dates outside the fiscal years }
  "/organizations/{organization_id}/reporting/reports/{id}/drill":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/id" } ]
    get:
      tags: [ Reports ]
      summary: "Statements: the balances behind one line, by account or by the centers of one account"
      parameters:
      - { name: line, in: query, required: true, schema: { type: string } }
      - { name: account_id, in: query, schema: { type: integer } }
      - { name: center_level, in: query, schema: { type: integer, minimum: 1, maximum: 6 } }
      - { $ref: "#/components/parameters/date" }
      - { $ref: "#/components/parameters/from" }
      - { $ref: "#/components/parameters/to" }
      responses: { "200": { description: "{ line, level, columns, rows }" } }
  "/organizations/{organization_id}/reporting/reports/{id}/copy":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/id" } ]
    post: { tags: [ Reports ], summary: "Copy into the organization (Reports.manage_statements)", responses: { "201": { description: The copy } } }
  "/organizations/{organization_id}/reporting/reports/{id}/archive":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/id" } ]
    post: { tags: [ Reports ], summary: Archive, responses: { "200": { description: OK } } }
  "/organizations/{organization_id}/reporting/reports/{id}/unarchive":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/id" } ]
    post: { tags: [ Reports ], summary: Restore, responses: { "200": { description: OK } } }
  "/organizations/{organization_id}/reporting/reports/{report_id}/grants":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/report_id" } ]
    get:
      tags: [ Report access ]
      summary: "Who else may view or edit the report (Reports.manage_access)"
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Grant" } } } } } }
    post:
      tags: [ Report access ]
      summary: Grant access (system reports get view access only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ grantee_type, grantee_id ]
              properties:
                grantee_type: { type: string, enum: [ Member, Role, Group, Department ] }
                grantee_id: { type: integer }
                access: { type: string, enum: [ view, edit ] }
      responses: { "200": { description: The grant }, "422": { description: Not a grantee of the organization } }
  "/organizations/{organization_id}/reporting/reports/{report_id}/grants/{id}":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/report_id" }, { $ref: "#/components/parameters/id" } ]
    delete: { tags: [ Report access ], summary: Remove access, responses: { "204": { description: Removed } } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/layout":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" } ]
    get:
      tags: [ Statement layouts ]
      summary: Lines, numbered rules and the chart of accounts for the editor
      responses: { "200": { description: "{ lines, rules, chart, center_levels, can_edit }" } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/inspection":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" } ]
    get:
      tags: [ Statement layouts ]
      summary: Every balance of a column with the line it is reflected in and the deciding rule
      description: Needs edit access to the report or the journal entry viewing permissions.
      parameters:
      - { name: column, in: query, schema: { type: string, enum: [ current, previous ] } }
      - { name: proposed_rules, in: query, description: "JSON list of rules to preview (adds proposed_line_key, changed)", schema: { type: string } }
      - { $ref: "#/components/parameters/date" }
      - { $ref: "#/components/parameters/from" }
      - { $ref: "#/components/parameters/to" }
      responses: { "200": { description: "{ column, rows, checks, proposed_checks }" } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/lines":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" } ]
    post:
      tags: [ Statement layouts ]
      summary: Add a line (key, parent_id, kind, normal_side, formula, label, style)
      responses: { "201": { description: The layout and line_id }, "422": { description: Invalid } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/lines/{id}":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" }, { $ref: "#/components/parameters/id" } ]
    patch: { tags: [ Statement layouts ], summary: Change a line (its key can't change), responses: { "200": { description: The layout } } }
    delete: { tags: [ Statement layouts ], summary: Delete a line not used by formulas, responses: { "200": { description: The layout }, "422": { description: Used by formulas } } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/lines/{id}/move":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" }, { $ref: "#/components/parameters/id" } ]
    post:
      tags: [ Statement layouts ]
      summary: Move under parent_id at index
      responses: { "200": { description: The layout } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/rules":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" } ]
    post:
      tags: [ Statement layouts ]
      summary: Add a mapping rule
      description: |
        statement_line_id, opposite_line_id, selector_type (category | ledger | account |
        account_range | profit_or_loss), selector, center_level, center_ids, center_type_ids,
        currency_ids, grain, measure, priority, note. 422 when it matches the same balances as
        another rule with the same priority and specificity.
      responses: { "201": { description: The layout and rule_id }, "422": { description: Invalid or overlapping } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/rules/{id}":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" }, { $ref: "#/components/parameters/id" } ]
    patch: { tags: [ Statement layouts ], summary: Change a rule, responses: { "200": { description: The layout } } }
    delete: { tags: [ Statement layouts ], summary: Delete a rule, responses: { "200": { description: The layout } } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/mapping_chats":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" } ]
    post:
      tags: [ Mapping assistant ]
      summary: "The member's open mapping chat of this report (created when needed)"
      description: Needs Reports.manage_statements and edit access to the report.
      responses: { "200": { description: The chat }, "403": { description: Not allowed } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/mapping_chats/{id}":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" }, { $ref: "#/components/parameters/id" } ]
    get: { tags: [ Mapping assistant ], summary: The chat with its messages and state.latest_proposal, responses: { "200": { description: OK } } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/mapping_chats/{id}/messages":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" }, { $ref: "#/components/parameters/id" } ]
    post: { tags: [ Mapping assistant ], summary: Send a message (processed in a job), responses: { "202": { description: Processing } } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/mapping_chats/{id}/preview":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" }, { $ref: "#/components/parameters/id" } ]
    get:
      tags: [ Mapping assistant ]
      summary: The inspection list with the selected changes applied
      parameters:
      - { name: indexes, in: query, description: "Comma-separated change indexes (default all)", schema: { type: string } }
      - { $ref: "#/components/parameters/date" }
      - { $ref: "#/components/parameters/from" }
      - { $ref: "#/components/parameters/to" }
      responses: { "200": { description: "Inspection payload plus changes" } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/mapping_chats/{id}/accept":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" }, { $ref: "#/components/parameters/id" } ]
    post:
      tags: [ Mapping assistant ]
      summary: Apply the selected changes to the rules (one transaction)
      requestBody: { content: { application/json: { schema: { type: object, properties: { indexes: { type: array, items: { type: integer } } } } } } }
      responses: { "200": { description: "{ chat, applied, layout }" }, "422": { description: Invalid against the current rules } }
  "/organizations/{organization_id}/accounting/statements/{statement_id}/mapping_chats/{id}/abandon":
    parameters: [ { $ref: "#/components/parameters/organization_id" }, { $ref: "#/components/parameters/statement_id" }, { $ref: "#/components/parameters/id" } ]
    post: { tags: [ Mapping assistant ], summary: Close the chat, responses: { "200": { description: OK } } }
