  "/organizations/{organization_id}/accounting/fiscal_year_closings/{id}":
    parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      description: Fiscal year ID
      schema:
        type: integer
    get:
      summary: Closing state and readiness of a fiscal year
      tags:
      - Fiscal Year Closing
      responses:
        '200':
          description: A step whose preview can't be built
          content:
            application/json:
              schema:
                type: object
                properties:
                  fiscal_year:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      start_date:
                        type: string
                        format: date
                      finish_date:
                        type: string
                        format: date
                      status:
                        type: string
                        enum:
                        - open
                        - closing
                        - closed
                      closing_step:
                        type:
                        - string
                        - 'null'
                  steps:
                    type: array
                    items:
                      type: string
                  current_step:
                    type: string
                    enum:
                    - readiness
                    - renumber
                    - revaluation
                    - temp_closing
                    - ending
                    - beginning
                    - finalized
                  settings:
                    type:
                    - object
                    - 'null'
                  readiness:
                    type:
                    - object
                    - 'null'
                    description: Only while the year is open
                    properties:
                      ready:
                        type: boolean
                      blockers:
                        type: array
                        items:
                          type: string
                          enum:
                          - not_open
                          - drafts
                          - unapproved_entries
                          - no_next_fiscal_year
                          - next_fiscal_year_not_open
                          - previous_fiscal_year_open
                          - settings_incomplete
                      drafts_count:
                        type: integer
                      booked_count:
                        type: integer
                      approved_count:
                        type: integer
                      next_fiscal_year:
                        oneOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            start_date:
                              type: string
                              format: date
                            finish_date:
                              type: string
                              format: date
                            status:
                              type: string
                              enum:
                              - open
                              - closing
                              - closed
                            closing_step:
                              type:
                              - string
                              - 'null'
                        - type: 'null'
                      settings_errors:
                        type: array
                        items:
                          type: string
                  revaluation_check:
                    type:
                    - object
                    - 'null'
                    description: 'Only at the revaluation step: dry run of a permanent
                      revaluation as of the last day'
                    properties:
                      as_of_date:
                        type: string
                        format: date
                      passes:
                        type: boolean
                      clean:
                        type: boolean
                      acknowledged:
                        type: boolean
                      acknowledgment:
                        type:
                        - object
                        - 'null'
                      total_difference:
                        type: string
                      temporaries:
                        type: array
                        items:
                          type: object
                      unrevalued:
                        type: array
                        items:
                          type: object
                      missing_rates:
                        type: array
                        items:
                          type: object
                      other_exclusions:
                        type: array
                        items:
                          type: object
                  temp_closing:
                    type:
                    - object
                    - 'null'
                    description: 'Only at the temp_closing step: preview of the entries
                      closing the income statement accounts'
                    properties:
                      closing_method:
                        type: string
                        enum:
                        - direct
                        - income_summary
                        - current_year_profit
                      net_result:
                        type: string
                        description: Profit (positive) or loss (negative) of the year
                      checksum:
                        type: string
                      postable:
                        type: boolean
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - close_accounts
                              - close_income_summary
                            target_account_id:
                              type: integer
                            total:
                              type: string
                            lines:
                              type: array
                              items:
                                type: object
                      problems:
                        type: array
                        items:
                          type: object
                  ending:
                    type:
                    - object
                    - 'null'
                    description: 'Only at the ending step: preview of the ending entry
                      (reverses every permanent balance)'
                    properties:
                      checksum:
                        type: string
                      postable:
                        type: boolean
                      balanced:
                        type: boolean
                      total:
                        type: string
                      open_temporary:
                        type: array
                        items:
                          type: object
                        description: Temporary balances that block the entry
                      lines:
                        type: array
                        items:
                          type: object
                  beginning:
                    type:
                    - object
                    - 'null'
                    description: 'Only at the beginning step: the ending entry mirrored
                      into the next year'
                    properties:
                      next_fiscal_year:
                        oneOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            start_date:
                              type: string
                              format: date
                            finish_date:
                              type: string
                              format: date
                            status:
                              type: string
                              enum:
                              - open
                              - closing
                              - closed
                            closing_step:
                              type:
                              - string
                              - 'null'
                        - type: 'null'
                      date:
                        type:
                        - string
                        - 'null'
                        format: date
                      postable:
                        type: boolean
                      blockers:
                        type: array
                        items:
                          type: string
                          enum:
                          - next_fiscal_year_missing
                          - next_fiscal_year_not_open
                          - beginning_entry_exists
                          - manual_beginning_entries
                          - next_year_permanent_revaluations
                      total:
                        type: string
                      lines:
                        type: array
                        items:
                          type: object
                      manual_beginning_entries:
                        type: array
                        items:
                          type: object
                      permanent_revaluations:
                        type: array
                        items:
                          type: object
                  summary:
                    type:
                    - object
                    - 'null'
                    description: Only once the year is closed
                    properties:
                      closed_at:
                        type:
                        - string
                        - 'null'
                      closed_by_name:
                        type:
                        - string
                        - 'null'
                      closing_method:
                        type:
