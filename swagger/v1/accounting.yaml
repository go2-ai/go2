  "/organizations/{organization_id}/accounting/balances":
    parameters:
    - name: organization_id
      in: path
      required: true
      schema:
        type: integer
    - name: fiscal_year_id
      in: query
      required: true
      schema:
        type: integer
    - name: as_of
      in: query
      format: date
      required: false
      description: Only entries dated on or before this date
      schema:
        type: string
    - name: monetary_only
      in: query
      required: false
      schema:
        type: boolean
    - name: foreign_only
      in: query
      required: false
      description: Exclude the main currency
      schema:
        type: boolean
    - name: approved_only
      in: query
      required: false
      schema:
        type: boolean
    - name: category_types[]
      in: query
      items:
        type: string
      required: false
      description: balance_sheet, income_statement, other
      schema:
        type: array
    get:
      summary: Balances grouped by account, centers and currency
      tags:
      - Balances
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id:
                          type: integer
                        account_code:
                          type:
                          - string
                          - 'null'
                        account_name:
                          type:
                          - string
                          - 'null'
                        centers:
                          type: array
                          items:
                            type: object
                            properties:
                              level:
                                type: integer
                                example: 1
                              id:
                                type: integer
                              code:
                                type:
                                - string
                                - 'null'
                              name:
                                type:
                                - string
                                - 'null'
                        currency_id:
                          type: integer
                        currency_abr:
                          type:
                          - string
                          - 'null'
                          example: EUR
                        debit:
                          type: string
                          example: '110.0'
                          description: Decimal string
                        credit:
                          type: string
                          example: '0.0'
                        base_balance:
                          type: string
                          example: '110.0'
                          description: Σ debit − Σ credit in the main currency
                        currency_balance:
                          type: string
                          example: '100.0'
                          description: Signed balance in the item currency
                      required:
                      - account_id
                      - centers
                      - currency_id
                      - debit
                      - credit
                      - base_balance
                      - currency_balance
        '422':
          description: Invalid date
        '403':
          description: Not authorized
