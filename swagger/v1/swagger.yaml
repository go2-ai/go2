      tags:
      - Departments
      responses:
        '200':
          description: Loaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Engineering
                    description:
                      type:
                      - string
                      - nil
                      example: Developers, UI/UX, QA, and mobile
                    abbreviation:
                      type:
                      - string
                      - nil
                      example: ENG
    post:
      summary: Creating a new department
      tags:
      - Departments
      parameters: []
      responses:
        '200':
          description: Creates the new department successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Engineering
                  description:
                    type:
                    - string
                    - nil
                    example: Developers, UI/UX, QA, and mobile
                  abbreviation:
                    type:
                    - string
                    - nil
                    example: ENG
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name_en:
                  type: string
                  example: Engineering
                name_fa:
                  type: string
                  example: مهندسی
                description_en:
                  type: string
                  example: Engineering team
                description_fa:
                  type: string
                  example: تیم مهندسی
                abbreviation:
                  type: string
                  example: ENG
  "/organizations/{organization_id}/departments/{id}":
    parameters:
    - name: organization_id
      in: path
      description: Organization ID
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: Department ID
      required: true
      schema:
        type: integer
    get:
      summary: Get the department
      tags:
      - Departments
      responses:
        '200':
          description: Loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: Engineering
                  description:
                    type:
                    - string
                    - nil
