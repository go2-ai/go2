      in: path
      description: Organization ID
      required: true
      schema:
        type: integer
    get:
      summary: Get versions for a specific record or deleted records
      tags:
      - Versions
      parameters:
      - name: record_type
        in: query
        required: false
        description: Record type (e.g., Department, Member)
        schema:
          type: string
      - name: record_id
        in: query
        required: false
        description: Record ID
        schema:
          type: integer
      - name: deleted
        in: query
        required: false
        description: Set to true to get deleted records
        schema:
          type: boolean
      - name: model_type
        in: query
        required: false
        description: Filter deleted records by model type
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Number of records to return
        example: 50
        schema:
          type: integer
      responses:
        '200':
          description: Returns deleted records filtered by model type
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    event:
                      type: string
                      enum:
                      - create
                      - update
                      - destroy
                      example: update
                    created_at:
                      type: string
                      example: 2026-08-02 20:00:06 UTC
                    item_type:
                      type: string
                      example: Department
                    item_id:
                      type: integer
                      example: 1
                    whodunnit:
                      type: string
                      example: '1'
                    user_display:
                      type: string
                      example: John Doe
                    record_display_name:
                      type: string
                      example: Engineering
                    user_avatar:
                      type:
                      - string
                      - 'null'
                      example:
                    user_initial:
                      type: string
                      example: JD
                    object_data:
                      type:
                      - object
                      - 'null'
                      example:
                    changes:
                      type: array
                      items:
                        type: object
                        properties:
                          field:
                            type: string
                            example: name
                          from:
                            type:
                            - string
                            - object
                            - integer
                            - 'null'
                            example: Old Name
                          to:
                            type:
                            - string
                            - object
                            - integer
                            - 'null'
                            example: New Name
                          field_label:
                            type: string
                            example: Name
        '400':
          description: Invalid request - missing parameters
        '403':
          description: Not authorized
