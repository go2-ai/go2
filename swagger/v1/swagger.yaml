                  created_at:
                    type: string
                    format: date-time
                    example: 2026-08-02 20:00:06 UTC
                  item_type:
                    type: string
                    example: Department
                  item_id:
                    type: integer
                    example: 1
                  whodunnit:
                    type: string
                    example: '1'
                  user_display:
                    type: string
                    example: John Doe
                  record_display_name:
                    type: string
                    example: Engineering
                  user_avatar:
                    type:
                    - string
                    - 'null'
                    example:
                  user_initial:
                    type: string
                    example: JD
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: name
                        from:
                          type:
                          - string
                          - object
                          - integer
                          - 'null'
                          example: Old Name
                        to:
                          type:
                          - string
                          - object
                          - integer
                          - 'null'
                          example: New Name
                        field_label:
                          type: string
                          example: Name
