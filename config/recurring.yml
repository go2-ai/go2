shared: &shared
  # ECB publishes reference rates around 16:00 CET on TARGET working days.
  fetch_exchange_rates:
    class: Accounting::ExchangeRates::FetchJob
    schedule: "30 16 * * 1-5 Europe/Berlin"
  # Starts due automatic currency revaluations (their own RRULEs decide when).
  dispatch_currency_revaluations:
    class: Accounting::Revaluation::DispatchJob
    schedule: every 15 minutes

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
